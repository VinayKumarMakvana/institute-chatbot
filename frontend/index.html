<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chatbot</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/dashboard.css">
    
<style>
.chat-container { display: flex; flex-direction: column; height: calc(100vh - 120px); background: rgba(2, 12, 6, 0.5); border: 1px solid rgba(0, 210, 97, 0.15); border-radius: 12px; overflow: hidden; }
.chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
.message { display: flex; gap: 12px; max-width: 80%; }
.message.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #00D261; color: #041209; flex-shrink: 0; }
.message.bot .msg-avatar { background: rgba(0, 210, 97, 0.1); color: #00D261; border: 1px solid rgba(0, 210, 97, 0.2); }
.msg-content { padding: 12px 16px; border-radius: 12px; background: rgba(255,255,255,0.03); color: #e5e7eb; font-size: 0.9rem; line-height: 1.5; }
.message.user .msg-content { background: #00D261; color: #041209; border-top-right-radius: 2px; }
.message.bot .msg-content { border-top-left-radius: 2px; border: 1px solid rgba(0, 210, 97, 0.1); }
.chat-input-area { padding: 16px; background: rgba(4, 18, 9, 0.8); border-top: 1px solid rgba(0, 210, 97, 0.15); display: flex; gap: 10px; }
.chat-input { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 12px 20px; color: #fff; outline: none; transition: border-color 0.3s; }
.chat-input:focus { border-color: #00D261; }
.send-btn { width: 44px; height: 44px; border-radius: 50%; background: #00D261; border: none; color: #041209; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
.send-btn:hover { transform: scale(1.05); }
.source-pills { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.source-pill { font-size: 0.7rem; padding: 4px 10px; background: rgba(0, 210, 97, 0.1); color: #00D261; border-radius: 12px; border: 1px solid rgba(0, 210, 97, 0.2); display: flex; align-items: center; gap: 4px; cursor: pointer; }
</style>

</head>
<body class="dashboard-page">

    <!-- Top Navbar -->
    <nav class="top-navbar">
        <div class="navbar-brand">
            <i data-lucide="graduation-cap" class="text-green"></i>
            Institution <span class="text-green">AI Assistant</span>
        </div>
        
        <div class="navbar-search">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" placeholder="Search...">
        </div>
        
        <div class="navbar-actions">
            <button class="icon-action-btn" onclick="window.location.href='notifications.html'">
                <i data-lucide="bell"></i>
                <span class="badge" id="nav-badge-count">0</span>
            </button>
            <div class="user-profile" onclick="window.location.href='profile.html'" style="cursor:pointer;">
                <div class="user-avatar" id="nav-avatar">U</div>
                <div class="user-info">
                    <span class="user-name" id="nav-name">Student</span>
                    <span class="user-role" id="nav-role">BCA 2nd Sem</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="dashboard-body">
        
        <!-- Left Sidebar (User) -->
        <aside class="sidebar">
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-item" id="nav-chat"><i data-lucide="bot"></i> AI Chatbot</a></li>
                <li><a href="chat_history.html" class="nav-item" id="nav-history"><i data-lucide="message-square"></i> My Queries</a></li>
                <li><a href="saved_answers.html" class="nav-item" id="nav-saved"><i data-lucide="bookmark"></i> Saved Answers</a></li>
                <li><a href="documents.html" class="nav-item" id="nav-docs"><i data-lucide="book-open"></i> Documents Library</a></li>
                <li><a href="document_viewer.html" class="nav-item" id="nav-viewer"><i data-lucide="file-search"></i> Document Viewer</a></li>
                <li><a href="live_updates.html" class="nav-item" id="nav-updates"><i data-lucide="megaphone"></i> Live Updates</a></li>
            </ul>
            <div style="margin-top: auto;">
                <div class="nav-divider"></div>
                <ul class="nav-menu">
                    <li>
                        <a href="notifications.html" class="nav-item" id="nav-notifications">
                            <i data-lucide="bell"></i> Notifications <span class="badge" id="sidebar-badge" style="margin-left:auto;">0</span>
                        </a>
                    </li>
                    <li><a href="profile.html" class="nav-item" id="nav-profile"><i data-lucide="user"></i> Profile & Settings</a></li>
                    <li><a href="login.html" class="nav-item logout-btn" style="color: #ef4444;"><i data-lucide="log-out"></i> Logout</a></li>
                </ul>
            </div>
        </aside>

        
        <main class="main-content">
            
            
    <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
            <!-- Messages will be injected here by chatbot.js -->
        </div>
        <div class="chat-input-area">
            <button class="action-btn-icon" style="color: #9ca3af;"><i data-lucide="paperclip"></i></button>
            <input type="text" class="chat-input" placeholder="Ask a question..." id="chat-input-box">
            <button class="send-btn"><i data-lucide="send" style="width:18px; height:18px;"></i></button>
        </div>
    </div>
    
        </main>
    </div>

    <!-- Scripts -->
    <script src="./js/api.js"></script>
    <script src="./js/chatbot.js"></script>
    <script>
        lucide.createIcons();
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
            } else {
                sidebar.classList.add('open');
                overlay.classList.add('show');
            }
        }
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(path.includes('index.html') || path === '/' || path.endsWith('/')) document.getElementById('nav-chat')?.classList.add('active');
            else if(path.includes('chat_history.html')) document.getElementById('nav-history')?.classList.add('active');
            else if(path.includes('saved_answers.html')) document.getElementById('nav-saved')?.classList.add('active');
            else if(path.includes('documents.html')) document.getElementById('nav-docs')?.classList.add('active');
            else if(path.includes('document_viewer.html')) document.getElementById('nav-viewer')?.classList.add('active');
            else if(path.includes('live_updates.html')) document.getElementById('nav-updates')?.classList.add('active');
            else if(path.includes('notifications.html')) document.getElementById('nav-notifications')?.classList.add('active');
            else if(path.includes('profile.html')) document.getElementById('nav-profile')?.classList.add('active');
        });
    </script>
</body>

</html>
