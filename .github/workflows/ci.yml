name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
        pip install bandit safety pytest pytest-asyncio httpx

    - name: Static Application Security Testing (SAST) - Bandit
      run: |
        cd backend
        bandit -r app/ -f json -o bandit_report.json || true
        cat bandit_report.json

    - name: Dependency Security Scan (SCA) - Safety
      run: |
        cd backend
        safety check -r requirements.txt || true

    - name: Secret Scan - TruffleHog
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ""
        head: ${{ github.sha }}
        extra_args: --debug --only-verified

    - name: Run Pytest Test Suite
      env:
        APP_ENV: testing
        JWT_SECRET: test_jwt_secret
      run: |
        cd backend
        pytest tests/ -v
